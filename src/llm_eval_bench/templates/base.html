<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Eval Bench</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; }
    nav { background: #1a1a2e; padding: 0.75rem 1.5rem; }
    nav a { color: #e0e0ff; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 0.55rem 0.85rem; border: 1px solid #ddd; text-align: left; }
    th { background: #f0f0f0; font-weight: 600; }
    tr:hover { background: #f9f9ff; }
    a { color: #2563eb; }
    .pass { color: #16a34a; font-weight: bold; }
    .fail { color: #dc2626; font-weight: bold; }
    .regression { background: #fff3cd; }
    .improvement { background: #d1fae5; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f8f8f8; border: 1px solid #ddd; padding: 0.75rem; margin: 0; font-size: 0.85rem; }
    details { margin-top: 0.5rem; }
    summary { cursor: pointer; font-weight: 600; padding: 0.3rem 0; }
    .empty { color: #666; font-style: italic; margin: 2rem 0; }
  </style>
</head>
<body>
  <nav><a href="/">&#127968; LLM Eval Bench</a></nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
